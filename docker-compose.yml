services:
  redis:
    image: redis:7-alpine
    container_name: zapfood_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - zapfood-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zapfood_rabbitmq
    ports:
      - "5672:5672"      
      - "15672:15672"   
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - zapfood-net

  api:
    build: .
    container_name: zapfood_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    profiles: ["full"]
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ZAPFOOD_EMBEDDED_WORKER: "0"
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped
    networks:
      - zapfood-net

  worker:
    build: .
    container_name: zapfood_worker
    command: python backend/worker.py
    profiles: ["full"]
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ZAPFOOD_EMBEDDED_WORKER: "0"
    depends_on:
      - redis
      - rabbitmq
    restart: on-failure
    networks:
      - zapfood-net

networks:
  zapfood-net:
    driver: bridge
